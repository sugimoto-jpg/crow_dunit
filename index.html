<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0b1026" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet" />
    <title>アイドマ営業クエスト</title>
  </head>
  <body>
    <div id="root">
      <div id="aq-fallback" style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#c7d2fe;font:14px/1.7 system-ui,sans-serif;background:#070a1c">
        <div>
          <div style="font-size:22px;font-weight:800;color:#ffd166">アイドマ営業クエスト</div>
          <div id="aq-fallback-msg">読み込み中…</div>
        </div>
      </div>
    </div>
    <script>
      // 起動見張り：スクリプトの読み込み・実行に失敗して画面が出ないときに、理由と再読み込みを案内する
      (function () {
        var errs = [];
        window.addEventListener('error', function (e) { errs.push((e && e.message) || 'script error'); });
        window.addEventListener('unhandledrejection', function (e) { errs.push(String((e && e.reason && e.reason.message) || e.reason)); });
        setTimeout(function () {
          if (window.__AQ_BOOTED) return;
          var el = document.getElementById('aq-fallback-msg');
          if (!el) return;
          el.innerHTML = 'アプリを起動できませんでした。<br>ページを再読み込みするか、別のブラウザ（Safari / Chrome）で開いてください。' +
            (errs.length ? '<br><small style="opacity:.7">' + errs.slice(0, 2).join(' / ').replace(/</g, '&lt;') + '</small>' : '') +
            '<br><button onclick="location.reload()" style="margin-top:12px;padding:8px 16px;border-radius:8px;border:1px solid #6366f1;background:#1c2653;color:#fff;font-weight:700">再読み込み</button>';
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
